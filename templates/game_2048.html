{% extends 'base.html' %}
{% load static %}
{% block title %}بازی ۲۰۴۸ | لرن کویست{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/games-shared.css' %}?v=20260808">
<script src="{% static 'js/games-shared.js' %}?v=20260808"></script>
<div class="gp-topbar">
    <a class="gp-back" href="/home/games/">🎮 همهٔ بازی‌ها</a>
    <span class="gp-hint">بازی کن → امتیاز و XP بگیر ⭐</span>
</div>

<style>
    .g2048-wrap { max-width: 520px; margin: 0 auto; padding: 16px; text-align: center; }
    .g2048-card { background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 18px; }
    .g2048-header {
        display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
        background: linear-gradient(135deg, #3B82F6, #FF6584); color: white;
        border-radius: 16px; padding: 10px 16px; margin-bottom: 14px;
    }
    .g2048-header .stat { background: rgba(255,255,255,.2); border-radius: 30px; padding: 4px 14px; font-weight: bold; }
    #board2048 {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        width: 100%; max-width: 420px; margin: 0 auto; aspect-ratio: 1;
        background: #bbada0; border-radius: 16px; padding: 8px;
        touch-action: none; user-select: none;
    }
    .cell {
        border-radius: 10px; background: #cdc1b4;
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: clamp(1rem, 6vw, 2rem); color: #776e65;
        transition: transform .1s;
    }
    .cell.t2 { background:#eee4da; } .cell.t4 { background:#ede0c8; }
    .cell.t8 { background:#f2b179; color:white; } .cell.t16 { background:#f59563; color:white; }
    .cell.t32 { background:#f67c5f; color:white; } .cell.t64 { background:#f65e3b; color:white; }
    .cell.t128,.cell.t256 { background:#edcf72; color:white; }
    .cell.t512,.cell.t1024 { background:#edc850; color:white; }
    .cell.t2048 { background:#edc22e; color:white; box-shadow:0 0 20px #edc22e; }
    .g2048-controls { margin-top: 14px; }
    .g2048-btn {
        border: none; border-radius: 14px; padding: 10px 22px; font-weight: bold;
        background: linear-gradient(135deg, #3B82F6, #FF6584); color: white;
        cursor: pointer; font-size: 1rem;
    }
    #g2048Msg { margin-top: 10px; font-weight: bold; min-height: 1.4em; color: #3B82F6; }
</style>

<div class="g2048-wrap">
    <div class="g2048-card">
        <div class="g2048-header">
            <span class="stat">🎯 امتیاز: <span id="score">0</span></span>
            <span class="stat">🏆 رکورد: <span id="best">0</span></span>
        </div>
        <div id="board2048"></div>
        <div class="g2048-controls">
            <button class="g2048-btn" id="restartBtn">🔄 بازی جدید</button>
            <div class="gp-xpline" id="g2048XpLine"></div>
        </div>
        <div id="g2048Msg">با کشیدن انگشت یا کلیدهای جهت‌دار بازی کن!</div>
    </div>
</div>

<script>
(function () {
    const boardEl = document.getElementById('board2048');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const msgEl = document.getElementById('g2048Msg');
    let grid, score = 0, best = 0, saved = false;

    function init() {
        grid = Array.from({length: 4}, () => [0,0,0,0]);
        score = 0; saved = false;
        addTile(); addTile();
        render();
        msgEl.textContent = 'با کشیدن انگشت یا کلیدهای جهت‌دار بازی کن!';
    }

    function addTile() {
        const empty = [];
        grid.forEach((row, r) => row.forEach((v, c) => { if (!v) empty.push([r, c]); }));
        if (!empty.length) return;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
        boardEl.innerHTML = '';
        grid.flat().forEach(v => {
            const d = document.createElement('div');
            d.className = 'cell' + (v ? ' t' + Math.min(v, 2048) : '');
            d.textContent = v || '';
            boardEl.appendChild(d);
        });
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; }
    }

    function slide(row) {
        let arr = row.filter(v => v);
        let gained = 0;
        for (let i = 0; i < arr.length - 1; i++) {
            if (arr[i] === arr[i+1]) { arr[i] *= 2; gained += arr[i]; arr.splice(i+1, 1); }
        }
        while (arr.length < 4) arr.push(0);
        return [arr, gained];
    }

    function move(dir) {
        const rotate = g => g[0].map((_, c) => g.map(row => row[c]));
        let g = grid.map(r => [...r]);
        if (dir === 'up') g = rotate(g);
        if (dir === 'right') g = g.map(r => [...r].reverse());
        if (dir === 'down') g = rotate(g).map(r => [...r].reverse());

        let moved = false, gained = 0;
        g = g.map(row => {
            const [newRow, gr] = slide(row);
            if (newRow.join() !== row.join()) moved = true;
            gained += gr;
            return newRow;
        });

        if (dir === 'down') { g = g.map(r => [...r].reverse()); g = rotate(g); }
        if (dir === 'right') g = g.map(r => [...r].reverse());
        if (dir === 'up') g = rotate(g);

        if (moved) {
            grid = g; score += gained; addTile(); render();
            if (grid.flat().includes(2048) && !saved) {
                msgEl.textContent = '🎉 تبریک! به ۲۰۴۸ رسیدی!';
                save(true);
            }
            if (!canMove()) { msgEl.textContent = '💀 بازی تمام شد! امتیازت: ' + score; save(true); }
        }
    }

    function canMove() {
        for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
            if (!grid[r][c]) return true;
            if (c < 3 && grid[r][c] === grid[r][c+1]) return true;
            if (r < 3 && grid[r][c] === grid[r+1][c]) return true;
        }
        return false;
    }

    function save(completed) {
        if (saved) return; saved = true;
        GP.saveScore('/games/save-2048-score/', {score: score, completed: completed}, 'g2048XpLine')
            .then(d => { if (d.best_score) { best = d.best_score; bestEl.textContent = best; } });
    }

    document.addEventListener('keydown', e => {
        const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
        if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });

    let tx, ty;
    boardEl.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
    boardEl.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left'); else move(dy > 0 ? 'down' : 'up');
    });

    document.getElementById('restartBtn').addEventListener('click', init);
    init();
})();
</script>
{% endblock %}
