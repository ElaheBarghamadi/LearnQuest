[project]
name = "learnquest-websocket"
version = "0.1.0"
description = "LearnQuest — gamified English learning platform (Django + Channels)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "daphne>=4.1",
    "channels>=4.0",
    "djangorestframework>=3.15",
    "django-ckeditor>=6.7",
    "django-js-asset>=2.2",
    "Pillow>=10.4",
    "cryptography>=43.0",
    "jdatetime>=5.0",
    "numpy>=2.1",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "uvicorn>=0.30",
]

[tool.uv]
package = false
